packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

catalogs:
  server:
    express: ^5.2.1
    '@types/express': ^5.0.6
    cors: ^2.8.6
    '@types/cors': ^2.8.19
    helmet: ^8.1.0
    morgan: ^1.10.1
    '@types/morgan': ^1.9.10
    pino: ^9.5.0
    pino-http: ^10.3.0
    pino-pretty: ^13.0.0
    prom-client: ^15.1.3

  core:
    turbo: ^2.9.14
    react: ^19.2.4
    react-dom: ^19.2.4
    '@types/react-dom': ^19.2.3
    '@types/react': ^19.2.7
    zod: ^4.3.6
    '@t3-oss/env-nextjs': ^0.13.11
    dotenv: ^17.4.2
    better-auth: ^1.6.11
    prisma: ^7.8.0
    pg: ^8.20.0
    '@types/pg': ^8.20.0
    '@prisma/client': ^7.8.0
    '@prisma/adapter-pg': ^7.8.0
    '@prisma/client-runtime-utils': ^7.8.0
    date-fns: ^4.1.0
    '@upstash/ratelimit': ^2.0.6
