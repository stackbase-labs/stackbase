name: CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/**"
      - "packages/**"
      - "templates/**"
      - "*.config.*"
      - "**/eslint.config.js"
      - "package.json"
      - "pnpm-*.yaml"
      - "tsconfig*.json"
      - "turbo.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "apps/**"
      - "packages/**"
      - "templates/**"
      - "*.config.*"
      - "**/eslint.config.js"
      - "package.json"
      - "pnpm-*.yaml"
      - "tsconfig*.json"
      - "turbo.json"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Run ESLint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Run type checking
        run: pnpm check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Build apps and packages
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: "https://stackbase-labs.vercel.app"

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

  check-templates:
    name: Check Template (${{ matrix.template }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        template: [base, web, api]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/${{ matrix.template }}/pnpm-lock.yaml

      - name: Install template dependencies
        run: pnpm --dir templates/${{ matrix.template }} install

      - name: Generate Prisma client
        run: pnpm --dir templates/${{ matrix.template }} --filter @workspace/db db:generate

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: templates/${{ matrix.template }}/.turbo
          key: turbo-${{ matrix.template }}-${{ runner.os }}-${{ hashFiles(format('templates/{0}/pnpm-lock.yaml', matrix.template), format('templates/{0}/turbo.json', matrix.template)) }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.template }}-${{ runner.os }}-${{ hashFiles(format('templates/{0}/pnpm-lock.yaml', matrix.template), format('templates/{0}/turbo.json', matrix.template)) }}-

      - name: Run template type checking
        run: pnpm --dir templates/${{ matrix.template }} check-types

      - name: Run template linting
        run: pnpm --dir templates/${{ matrix.template }} lint

      - name: Run template tests
        run: pnpm --dir templates/${{ matrix.template }} test
