services:
  postgres:
    image: postgres:16-alpine
    container_name: api-postgres-dev
    environment:
      POSTGRES_DB: api-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - api-app_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: api-redis-dev
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'always',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - api-app_redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  upstash-redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: api-upstash-redis-http-dev
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: api-local-redis
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '127.0.0.1:8079:80'
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: api-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - api-app_minio_data_dev:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  api-app_postgres_data_dev:
  api-app_redis_data_dev:
  api-app_minio_data_dev:
