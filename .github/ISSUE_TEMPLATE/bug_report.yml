name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Stackbase CLI or starter templates.
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it quickly.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of Stackbase is affected?
      options:
        - CLI (packages/stackbase)
        - Base Template (templates/base)
        - Web Template (templates/web)
        - API Template (templates/api)
        - Documentation (apps/docs)
        - Build / Toolchain
    validations:
      required: true

  - type: dropdown
    id: package-manager
    attributes:
      label: Package Manager
      description: Which package manager are you using?
      options:
        - pnpm
        - bun
        - npm
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node.js version, OS, Stackbase version (e.g. Node 24.2.0, macOS 15, Stackbase 2.2.0)
      placeholder: "Node: v24.x, OS: Windows 11 / macOS / Ubuntu, Stackbase: 2.2.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Run `npx stackbase init my-app`
        2. Select `...`
        3. Run `stackbase add queue`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Please copy and paste any relevant terminal output or stack traces.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using a supported Node.js version (v24+).
          required: true
