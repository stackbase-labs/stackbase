apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackbase-api-deployment
  namespace: stackbase
  labels:
    app: stackbase-api
spec:
  # replicas is intentionally omitted: the HorizontalPodAutoscaler
  # (k8s/api-hpa.yml) owns this value. Setting it here would reset the
  # pod count on every `kubectl apply`, fighting the autoscaler.
  selector:
    matchLabels:
      app: stackbase-api
  template:
    metadata:
      labels:
        app: stackbase-api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: stackbase-api
          image: your-dockerhub-username/stackbase-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: stackbase-api-env
            - configMapRef:
                name: stackbase-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
