services:
  postgres:
    image: postgres:16-alpine
    container_name: stackbase-postgres-dev
    environment:
      POSTGRES_DB: stackbase-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - stackbase-app_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  stackbase-app_postgres_data_dev:
